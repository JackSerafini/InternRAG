apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: qdrant
  namespace: orfeo-rag

spec:
  ingressClassName: nginx-devel
  rules:
  - host: db-rag.dev.rd.areasciencepark.it
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: qdrant
            port:
              number: 6333