ollama:
  enabled: false

pipelines:
  enabled: false

websocket:
  enabled: false

persistence:
  enabled: true

  # FIRST DEPLOYMENT
  # size: 5Gi
  # storageClass: rbd-nvme-replica
  # annotations:
  #   helm.sh/resource-policy: keep

  # FROM THE SECOND DEPLOYMENT
  existingClaim: open-webui

resources:
  requests:
    cpu: 1
    memory: 2Gi
  limits:
    cpu: 1
    memory: 2Gi

copyAppData:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 100m
      memory: 256Mi

hostAliases:
  - ip: "10.128.8.65"
  # - ip: "10.128.18.132"
    hostnames:
      - "auth-rag.dev.rd.areasciencepark.it"
      # - "auth.local"

sso:
  enabled: true
  enableSignup: true
  oidc:
    enabled: true
    clientId: "open-webui"
    clientExistingSecret: "open-webui-oidc"
    clientExistingSecretKey: "client-secret"
    providerUrl: "http://keycloak-keycloakx-http.orfeo-rag.svc.cluster.local/realms/orfeo/.well-known/openid-configuration"
    providerName: "Keycloak"

extraEnvVars:
  - name: WEBUI_URL
    value: "http://llm-rag.dev.rd.areasciencepark.it"
  - name: OPENID_REDIRECT_URI
    value: "http://llm-rag.dev.rd.areasciencepark.it/oauth/oidc/callback"
  - name: ENABLE_OAUTH_PERSISTENT_CONFIG
    value: "false"

# openaiBaseApiUrl: "https://orfeo-llm.areasciencepark.it/vllm/v1"
# openaiApiKeyExistingSecret: "vllm-api-key"
# openaiApiKeyExistingSecretKey: "api-key"

openaiBaseApiUrls:
  - "https://orfeo-llm.areasciencepark.it/vllm/v1"
  - "http://rag-retrieval.orfeo-rag.svc.cluster.local:1416/v1"
openaiApiKeysExistingSecret: "vllm-api-keys"
openaiApiKeysExistingSecretKey: "api-keys"