apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openwebui
  namespace: orfeo-rag
spec:
  ingressClassName: nginx-public
  rules:
  - host: chat.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: open-webui
            port:
              number: 80
      - path: /rag-images
        pathType: Prefix
        backend:
          service:
            name: rag-retrieval # your retrieval Service name
            port:
              number: 1416