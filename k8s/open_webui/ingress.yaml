apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openwebui
  namespace: orfeo-rag
spec:
  ingressClassName: nginx-devel
  # ingressClassName: nginx-public
  rules:
  - host: llm-rag.dev.rd.areasciencepark.it
  # - host: chat.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: open-webui
            port:
              number: 80
      - path: /rag-images
        pathType: Prefix
        backend:
          service:
            name: rag-retrieval
            port:
              number: 1416
      - path: /rag-images-lame
        pathType: Prefix
        backend:
          service:
            name: rag-retrieval
            port:
              number: 1416