apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: orfeo-rag

spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello

  template:
    metadata:
      labels:
        app: hello

    spec:
      containers:
      - name: hello
        image: nginx:latest

        ports:
        - containerPort: 80

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"