[project]
name = "sem-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "lagiacromo2803@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.13",
    "hayhooks>=2.1.0",
    "pandas>=3.0.6",
    "qdrant-haystack>=12.0.0",
    "scikit-image>=0.26.0",
    "torch>=2.13.0",
    "transformers>=5.17.0",
    "vllm-haystack>=2.1.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "deepeval-haystack>=0.3.0",
    "docling-haystack>=2.0.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "scikit-learn>=1.9.1",
]
